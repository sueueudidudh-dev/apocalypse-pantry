modLoader="javafml"
loaderVersion="${loader_range}"
license="MIT"
issueTrackerURL="https://github.com/sueueudidudh-dev/apocalypse-pantry/issues"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
authors="${author}"
logoFile="apocalypsedelight_logo.png"
credits="Farmer's Delight by vectorwing."
description='''
A Farmer's Delight add-on with food for the end of the world: 48 survival foods cooked in the cooking pot, on the cutting board and at the crafting table, and five effects built around a zombie apocalypse. Zombies can infect you; only Herbal Tea cures it.
'''

[[mixins]]
config="${id}.mixins.json"

[[dependencies.${id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${id}]]
    modId="farmersdelight"
    type="required"
    versionRange="${fd_range}"
    ordering="AFTER"
    side="BOTH"
